name: Build Compiler
on:
  workflow_dispatch:
    inputs:
      version:
        name: 'Version'
        required: true
        type: string
      title:
        name: 'Title'
        required: true
        type: string

env:
  CI_LIBS_LATEST: https://github.com/qatlang/ci-files/releases/latest/download

jobs:
  create_release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List releases
        id: list_releases
        run: echo "release_list=$(gh release list)" >> $GITHUB_OUTPUT
      - name: Create release
        if: ${{ !contains(steps.list_releases.outputs.release_list, inputs.version) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ inputs.version }}" --title "v${{ inputs.version }}" --notes "Release notes are updated manually, so it is work in progress" --draft

  windows:
    name: Windows
    needs: [create_release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create directories
        run: |
          New-Item -ItemType Directory -Path ${{ github.workspace }}/../libs
          Write-Output "LIBDIR_PATH=$((Join-Path ${{ github.workspace }} ../libs) | Resolve-Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-ChildItem -Path "${{ env.LIBDIR_PATH }}"

      - name: Install Visual Studio Build Tools
        run: choco install visualstudio2022buildtools --package-parameters "--add Microsoft.Component.MSBuild --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --no-includeRecommended --installWhileDownloading"
        
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Download & extract dependencies
        working-directory: ../libs
        run: |
          Invoke-WebRequest ${{ env.CI_LIBS_LATEST }}/llvm_windows_x86_64.tar.gz -OutFile llvm_windows_x86_64.tar.gz
          7z x llvm_windows_x86_64.tar.gz
          Invoke-WebRequest ${{ env.CI_LIBS_LATEST }}/boost_windows_x86_64.tar.gz -OutFile boost_windows_x86_64.tar.gz
          7z x boost_windows_x86_64.tar.gz

      - name: CMake configuration for x86_64
        run: cmake -DCMAKE_BUILD_TYPE=Release -DLIBS_DIR="${{ env.LIBDIR_PATH }}" -DLLVM_DIR="${{ env.LIBDIR_PATH }}/llvm" -DBOOST_DIR="${{ env.LIBDIR_PATH }}/boost" -G"Visual Studio 17 2022" -S ./src/ -B ./build/

      - name: Build project for x86_64
        run: cmake --build ./build/ --config Release --parallel 8 --target package

      - name: Install GitHub CLI
        run: choco install gh

      - name: Uploading build for x86_64
        run: gh release upload "v${{ inputs.version }}" ./build/qat-${{ inputs.version }}-windows-x86_64.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
